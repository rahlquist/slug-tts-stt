# FLM (FastFlowLM) requires unlimited locked memory to initialise the AMD XDNA2 NPU.
# With the default 8 MB limit, `flm validate` fails with:
#   [ERROR] Memlock limit is too low (8MB). Please raise the limit or set to infinity.
# Install to /etc/security/limits.d/ and re-login (systemd units additionally set
# LimitMEMLOCK=infinity, which is what actually covers the services at boot).

*    soft memlock unlimited
*    hard memlock unlimited
root soft memlock unlimited
root hard memlock unlimited
